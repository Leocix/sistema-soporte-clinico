name: cdss_adherencia
description: >-
  Aplicacion del paciente del sistema de soporte clinico para prevenir el
  incumplimiento terapeutico en hipertensos y diabeticos polimedicados.
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Cliente HTTP hacia el API Gateway.
  http: ^1.2.2
  # Persistencia local: token de sesion, plan de tomas y cola de envio
  # pendiente cuando el telefono esta sin conexion.
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
